name: Patch PDF presentation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-pdf-presentation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update presentation viewer
        run: python patch_pdf.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js
          git diff --cached --quiet || (git commit -m "feat: turn PDF into in-page slideshow" && git push)
