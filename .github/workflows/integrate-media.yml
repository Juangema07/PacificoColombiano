name: Integrar multimedia
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, '[media-integrated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insertar infografias y video
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''.infographic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px}.infographic-card{overflow:hidden;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:rgba(255,255,255,.035)}.infographic-card img{display:block;width:100%;height:auto;max-height:620px;object-fit:contain;background:#fff}.infographic-card .infographic-caption{padding:16px 18px}.infographic-card .infographic-caption strong{display:block;margin-bottom:5px}.infographic-card .infographic-caption span{color:rgba(255,255,255,.62);font-size:.9rem;line-height:1.5}.media-video{width:100%;display:block;margin-top:14px;border-radius:18px;background:#020b0e;box-shadow:0 20px 55px rgba(0,0,0,.28);max-height:680px}.video-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;color:rgba(255,255,255,.58);font-size:.82rem}.media-video-wrap{margin-top:20px;padding:18px;border:1px solid rgba(255,255,255,.1);border-radius:22px;background:rgba(255,255,255,.025)}@media(max-width:760px){.infographic-grid{grid-template-columns:1fr}.infographic-card img{max-height:none}.media-video-wrap{padding:12px}}'''
          if '.infographic-grid{' not in s:
              s = s.replace('</style>', css + '</style>', 1)
          marker = '<article class="media-real media-wide"><div class="audio-label"><span>📽 PRESENTACIÓN</span><span>PDF · POWERPOINT</span></div>'
          block = '''<article class="media-real media-wide"><div class="audio-label"><span>📊 INFOGRAFÍAS</span><span>VISUALES · GRUPO</span></div><h3>Infografías del Pacífico</h3><p>Consulta las dos infografías incorporadas al repositorio directamente desde la web.</p><div class="infographic-grid"><div class="infographic-card"><img src="IMG-20260915-WA0007.jpg" alt="Infografía del Pacífico colombiano" loading="lazy"><div class="infographic-caption"><strong>Infografía 01</strong><span>Material visual del proyecto.</span></div></div><div class="infographic-card"><img src="IMG-20260915-WA0008.jpg" alt="Infografía del Pacífico colombiano" loading="lazy"><div class="infographic-caption"><strong>Infografía 02</strong><span>Material visual del proyecto.</span></div></div></div></article><article class="media-real media-wide"><div class="audio-label"><span>🎬 VIDEO</span><span>MP4 · 21,8 MB</span></div><h3>Video del proyecto</h3><p>Reproduce el video directamente desde la página. La versión incluida está optimizada para web.</p><div class="media-video-wrap"><video class="media-video" controls preload="metadata" playsinline poster="IMG-20260915-WA0007.jpg"><source src="VID-20260915-WA0006_web.mp4" type="video/mp4">Tu navegador no puede reproducir este video.</video><div class="video-meta"><span>▶ Reproducción directa</span><span>MP4 · H.264 · optimizado para web</span></div></div><a class="file-link" href="VID-20260915-WA0006_web.mp4" download="VID-20260915-WA0006_web.mp4">⬇ Descargar video</a></article>'''
          if 'VID-20260915-WA0006_web.mp4' not in s:
              s = s.replace(marker, block + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Guardar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Integra infografias y video [media-integrated]'
          git push
